[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-boundary-poc"
version = "0.1.2"
description = "A runnable proof of concept for trajectory-aware authorization of autonomous agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Crizan Belem Ribeiro"}]
keywords = ["agentic-ai", "authorization", "capabilities", "security", "formal-methods"]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE-PROVISIONAL.md"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=43,<47",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "z3-solver>=4.13,<5",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.27,<1",
]
release = [
  "build>=1.2,<2",
  "twine>=5.1,<7",
]

[project.urls]
Repository = "https://github.com/belemcrizan/Veritas"
Documentation = "https://github.com/belemcrizan/Veritas/tree/main/docs"
Issues = "https://github.com/belemcrizan/Veritas/issues"

[project.scripts]
veritas = "veritas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veritas = ["py.typed"]
"veritas.resources" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["veritas"]
