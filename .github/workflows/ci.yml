name: ci

on:
  push:
  pull_request:

jobs:
  local-safety-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_portability.py
      - run: python tools/check_smt.py
      - run: veritas policy-check policies/payment_policy.json
      - run: veritas demo
      - run: veritas bench

