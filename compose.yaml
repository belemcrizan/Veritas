services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: veritas
      POSTGRES_USER: veritas
      POSTGRES_DB: veritas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  veritas:
    build: .
    command: ["showcase"]
    environment:
      VERITAS_ENV: local
      VERITAS_POSTGRES_DSN: postgresql://veritas:veritas@postgres:5432/veritas
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - veritas-data:/data

volumes:
  veritas-data:
